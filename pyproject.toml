[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashfood-poo"
version = "0.1.0"
description = "Caso educativo de delivery con programación orientada a objetos"
requires-python = ">=3.11"

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]

[project.scripts]
flashfood = "flashfood.demo:main"
flashfood-desktop = "flashfood.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]
