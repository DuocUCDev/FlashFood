[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashfood-poo"
version = "1.0.0"
description = "Operación 13:00 de FlashFood: pedidos, pagos y reparto con POO, MVC y JSON"
requires-python = ">=3.12"

[project.scripts]
flashfood = "flashfood.__main__:main"
flashfood-demo = "flashfood.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
